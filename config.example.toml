# ~/.config/agentbox/config.toml - global defaults for every box.
# A project's .agentbox.toml replaces the scalars here and adds to the lists.

# What the shared base image is built from. Everything here describes the
# IMAGE, not a box, so a project's .agentbox.toml cannot change any of it -
# there is one image per host and every box overlays it.
#
# By default the guest follows the host, because the host is what bootstraps
# it: an Arch host builds an Arch image with pacman, a Debian or Ubuntu host
# builds one of its own release with debootstrap. Set these only to override
# that. Changing any of them needs `agentbox build --force`.
# [base]
# distro    = "ubuntu"                       # arch | debian | ubuntu
# suite     = "noble"                        # release codename (Debian family)
# mirror    = "http://archive.ubuntu.com/ubuntu"   # default: whatever mirror
#                                            # this host's own apt is set to
# security_mirror = "http://security.debian.org/debian-security"  # Debian only
# components = "main restricted universe multiverse"

# Packages baked into the shared base image. This list REPLACES the built-in
# one rather than adding to it, so whatever you write here is the whole image -
# which is why what follows is the built-in list itself, verbatim. Uncommenting
# one changes nothing; add your own lines to it and nothing goes missing.
# Changing it needs `agentbox build --refresh` (adds packages) or `--force`
# (rebuilds from scratch), with every box powered off - see
# docs/setup.md#adding-a-package-to-every-box.
#
# There is one built-in list per guest, since the names are not the same
# distribution to distribution. The list for an Arch image:
# base_packages = [
#   "base", "base-devel", "sudo", "openssh", "ca-certificates", "gnupg",
#   "git", "jujutsu", "github-cli", "git-lfs", "curl", "wget", "rsync",
#   "unzip", "zstd", "jq", "vim", "less", "man-db", "tree", "which",
#   "diffutils", "inetutils", "procps-ng", "strace", "tmux", "ripgrep",
#   "fd", "fzf", "iputils", "python", "python-pip", "nodejs", "npm",
#   "bash-completion", "fish",
# ]
#
# ...and for a Debian or Ubuntu image. systemd, systemd-sysv, systemd-resolved
# and dbus are not optional: a Debian image without them cannot boot or be
# attached to, and `iproute2` is how agentbox tells whether a `nat` box's
# uplink came up. `jujutsu` is absent because no Debian stable release or
# Ubuntu LTS packages it yet - add `jj` per project with `packages`, or install
# it in the box.
# base_packages = [
#   "systemd", "systemd-sysv", "systemd-resolved", "dbus", "build-essential",
#   "pkg-config", "sudo", "openssh-client", "ca-certificates", "gnupg",
#   "git", "gh", "git-lfs", "curl", "wget", "rsync", "unzip", "xz-utils",
#   "zstd", "jq", "vim", "less", "man-db", "tree", "file", "diffutils",
#   "iproute2", "iputils-ping", "bind9-dnsutils", "netcat-openbsd", "procps",
#   "psmisc",
#   "strace", "tmux", "ripgrep", "fd-find", "fzf", "python3", "python3-pip",
#   "python3-venv", "nodejs", "npm", "locales", "ncurses-term",
#   "bash-completion", "fish",
# ]

# Lists here are added to the built-in defaults rather than replacing them, and
# a project's .agentbox.toml adds to both. There is no way to subtract, so keep
# this file to what every box on this host genuinely wants.

[defaults]
# network = "nat"   # nat (default) | host | none  (host exposes localhost/X11)

# Read-only mounts every box gets, on top of the built-in ~/.gitconfig,
# ~/.config/git and ~/.config/jj. Keep credentials out of this list.
ro = []

# Read-write mounts every box gets. Usually empty; the project dir is implicit.
rw = []

# One-time copy-if-absent sources every box gets: "src" or "src:dst", same
# syntax as rw/ro, but never a live mount. Each source is copied into the box
# ONCE, the first time its destination is absent - never re-synced from the
# host afterwards, so `agentbox reset` (which empties the box's writes) is
# what makes the next boot copy fresh again. Good for seeding editable state
# (a starter config, a vendored cache) that the box should be free to diverge
# from without ever writing back to the host.
# cpy = []

# Host environment variables forwarded into the box when they are set, on top
# of the built-in TERM, COLORTERM and LANG.
# pass_env = ["CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_API_KEY", "GITHUB_TOKEN"]

# Private SSH keys every box on this host may use. agentbox starts a dedicated
# ssh-agent per box holding ONLY these keys (added with confirm-on-use) and
# forwards that agent's socket in; the host's own agent is never exposed. Most
# hosts leave this empty and set ssh_keys per project instead, since keys are
# usually project-specific. Empty - the default - means no agent, no forwarding.
# ssh_keys = ["~/.ssh/id_ed25519"]

# Resource caps applied to the container's systemd scope.
# memory_max = "16G"
# cpu_quota  = "800%"
# tasks_max  = "4096"

# AppArmor confinement, a defense-in-depth LSM layer behind the user namespace,
# seccomp and mount plan. Unset - the default - applies the shipped profile when
# it is loaded on this host and does nothing otherwise, so it never breaks a box.
# Set false to opt out, or true to be warned when the profile is expected but not
# loaded. See contrib/apparmor/README.md to install and load it (per-distro).
# apparmor = true

# Login shell inside the box. Defaults to your host shell if the base image
# has it, otherwise /bin/bash.
# shell = "/usr/bin/fish"

# Allow perf_event_open inside the box (SystemCallFilter=). Off by default,
# and by itself this rarely unlocks much: the box's user namespace means
# perf's own permission check can never succeed there no matter what
# capability the box holds, so this alone only allows self-only software
# counters. Profiling hardware or kernel events also needs the HOST's
# kernel.perf_event_paranoid lowered - a machine-wide relaxation, not scoped
# to this box - and the shipped AppArmor profile does not mediate this
# syscall at all. Read docs/security.md#perf-inside-a-box before turning
# this on.
# perf = true

# Socket address families every box may use, as RestrictAddressFamilies=.
# Unset - the default - applies no filter and says so explicitly, which is what
# stops systemd-nspawn 261+ warning that a future release will narrow the
# default to AF_INET, AF_INET6 and AF_UNIX. Narrowing breaks ip, ss, udev and
# glibc's resolver, all of which need AF_NETLINK.
# address_families = "AF_INET AF_INET6 AF_UNIX AF_NETLINK"

# Terminal background while a session runs. Unset - the default - leaves the
# terminal whatever colour it already was. "auto" lets systemd-run pick its own
# per-box tint; an ANSI SGR background such as "48;5;52" picks your own.
# background = "auto"

# UID range the container's 0..65535 is mapped onto. Must be a multiple of
# 65536. Change this only before building the base image.
# uid_base = 1310720000
