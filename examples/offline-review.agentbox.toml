# Locked down: a refactor or review task with no network at all. Everything the
# agent needs must be baked in at creation time, since pacman cannot reach a
# mirror once the box exists.
name = "review"
network = "none"

packages = ["ruff", "mypy", "python-pytest"]

# Nothing extra to map: ~/.gitconfig, ~/.config/git and ~/.config/jj come with
# every box.

memory_max = "8G"
cpu_quota = "400%"
