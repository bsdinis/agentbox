# A pnpm monorepo. node_modules stays inside the box: it is huge, disposable,
# and platform-specific, so keeping it out of the host tree is a feature.
name = "web"
network = "host"

packages = ["pnpm", "chromium"]

# Added to the built-in read-only mounts (~/.gitconfig, ~/.config/git,
# ~/.config/jj), not instead of them.
ro = ["~/.npmrc"]

# Likewise added to the forwarded TERM, COLORTERM and LANG.
pass_env = ["ANTHROPIC_API_KEY"]

memory_max = "12G"

[env]
PLAYWRIGHT_BROWSERS_PATH = "/usr/lib/chromium"
CI = "1"
