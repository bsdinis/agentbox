[package]
name = "agentbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Per-project systemd-nspawn sandboxes for coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
